name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    name: Build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      # actions-rs/toolchain is archived; dtolnay/rust-toolchain is the
      # maintained equivalent.
      - uses: dtolnay/rust-toolchain@stable
      - name: Build release binary
        run: cargo build --release
      # Unique per-platform names prevent asset collisions on the release
      # (and skip the Windows .pdb debug symbols).
      - name: Stage binary with a platform-specific name
        shell: bash
        run: |
          case "$RUNNER_OS" in
            Windows) cp target/release/blackjack.exe target/release/blackjack-windows-x64.exe ;;
            macOS)   cp target/release/blackjack     target/release/blackjack-macos-arm64 ;;
            Linux)   cp target/release/blackjack     target/release/blackjack-linux-x64 ;;
          esac
      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: blackjack-${{ matrix.os }}
          path: target/release/blackjack-*

  release:
    name: Attach binaries to the GitHub release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Attach binaries to the release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/blackjack-*/blackjack-*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
